<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Barre du navigateur : couleur de l'en-tête, une balise par thème du téléphone (T18). -->
    <meta name="theme-color" content="#1F4D3A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C3A2C" media="(prefers-color-scheme: dark)" />
    <!-- T18 : thème clair ou sombre forcé (réglage Apparence) posé avant le premier affichage,
         sans écran clair qui clignote. Script classique bloquant, fichier de l'appli (CSP), généré
         par `pnpm --filter @planif/web jetons` (scripts/theme-initial-contenu.ts). -->
    <script src="/theme-initial.js"></script>
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <!-- Polices de l'écran de connexion, demandées dès le HTML (T16). crossorigin : les polices se
         chargent en CORS ; sans lui, chaque fichier partirait deux fois. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/polices/archivo-latin-112-wght.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/polices/atkinson-hyperlegible-latin-400.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/polices/atkinson-hyperlegible-latin-700.woff2" />
    <title>Planifications</title>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Diagnostic de la synchro</title>
    <link rel="stylesheet" href="./synchro.css" />
  </head>
  <body>
    <h1>Diagnostic de la synchro</h1>
    <p>État : <strong id="etat" data-testid="etat-synchro" data-etat="connexion">connexion…</strong></p>
    <p id="erreur" class="refus" hidden></p>
    <p><button id="deconnexion" type="button">Se déconnecter</button> <strong id="deconnecte" data-testid="deconnecte" hidden>déconnecté</strong></p>
    <div id="confirmation-deconnexion" data-testid="confirmation-deconnexion" role="alertdialog" aria-labelledby="question-deconnexion" hidden>
      <p id="question-deconnexion"></p>
      <button id="deconnexion-confirmee" type="button">Se déconnecter quand même</button>
      <button id="deconnexion-annulee" type="button">Annuler</button>
    </div>
    <form id="saisie">
      <label for="quantite">Quantité (kg)</label>
      <input id="quantite" name="quantite" type="number" inputmode="decimal" step="any" min="0" required />
      <button type="submit">Enregistrer la récolte</button>
    </form>
    <button id="modifier" type="button">Modifier la dernière récolte sur place</button>
    <button id="autre-ferme" type="button">Saisir une récolte pour une autre ferme</button>
    <p>Écriture interdite envoyée : <code id="put-interdit" data-testid="put-interdit"></code></p>
    <h2>Récoltes</h2>
    <ul id="recoltes"></ul>
    <h2>Événements en base locale</h2>
    <ul id="evenements-locaux"></ul>
    <h2>Refus du serveur</h2>
    <ul id="refus" class="refus"></ul>
    <script type="module" src="/src/diagnostic/synchro.ts"></script>
  </body>
</html>

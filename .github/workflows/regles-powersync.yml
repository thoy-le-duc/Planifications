name: Règles de synchro PowerSync

# T67 : déploie powersync/sync-config.yaml sur l'instance PowerSync Cloud de production, sans
# copier-coller dans le tableau de bord. Seulement après des « Migrations de production » réussies
# sur main (les règles peuvent viser une table que la migration vient de créer), ou à la main
# depuis main (secours). Jamais sur une PR : le dépôt est public, une PR (ou un fork) ne doit
# jamais approcher le jeton PowerSync.
#
# Voie officielle : la CLI PowerSync (https://docs.powersync.com/tools/cli), figée par version
# exacte et lockfile dans scripts/powersync-cli/. Secrets et variables à poser : docs/mise-en-ligne.md, étape 3 bis.
on:
  workflow_run:
    workflows: [Migrations de production]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un déploiement à la fois ; celui en cours n'est jamais annulé.
concurrency:
  group: regles-powersync
  cancel-in-progress: false

jobs:
  deployer:
    name: Valider puis déployer les règles de synchro
    # Une exécution des migrations sans job lancé (CI rouge, autre branche) conclut `skipped`, pas
    # `success` : rien n'est déployé. Les migrations elles-mêmes ne partent que de la CI de main
    # (`workflow_run`) ou d'un lancement à la main (`workflow_dispatch`) ; jamais `push`, qu'elles
    # n'ont pas comme déclencheur.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # Les secrets POWERSYNC_ADMIN_TOKEN et POWERSYNC_INSTANCE_ID sont des secrets de
    # l'environnement « production », réservé à la branche main (Settings → Environments).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Le commit que les migrations viennent d'appliquer (workflow_run), ou main (à la main).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # Sans secret, et sans cache : la CLI et ses dépendances viennent du lockfile, empreintes
      # vérifiées, sans aucun script d'installation.
      - name: Installer la CLI PowerSync figée
        run: pnpm --dir scripts/powersync-cli install --frozen-lockfile --ignore-workspace --ignore-scripts
      - name: Valider les règles de synchro, ou arrêt propre si les secrets sont absents
        env:
          POWERSYNC_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
          POWERSYNC_INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
          # Identifiants non secrets (variables de l'environnement production) : sans eux, la CLI les
          # déduit de l'instance et masque toute erreur derrière « Instance … was not found » (T73).
          POWERSYNC_ORG_ID: ${{ vars.POWERSYNC_ORG_ID }}
          POWERSYNC_PROJECT_ID: ${{ vars.POWERSYNC_PROJECT_ID }}
        run: bash scripts/deployer-regles-powersync.sh valider
      - name: Déployer les règles de synchro, ou arrêt propre si les secrets sont absents
        env:
          POWERSYNC_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
          POWERSYNC_INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
          # Identifiants non secrets (variables de l'environnement production) : sans eux, la CLI les
          # déduit de l'instance et masque toute erreur derrière « Instance … was not found » (T73).
          POWERSYNC_ORG_ID: ${{ vars.POWERSYNC_ORG_ID }}
          POWERSYNC_PROJECT_ID: ${{ vars.POWERSYNC_PROJECT_ID }}
        run: bash scripts/deployer-regles-powersync.sh deployer

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Typage, lint, tests, build, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Pas de bloc `services:` pour Postgres : il n'y prend pas d'options de commande, et le service
    # PowerSync exige wal_level=logical (tests des règles de synchro, T10). Postgres est lancé par
    # `docker run` ci-dessous.
    env:
      # Tests d'intégration de @planif/db (T08) : sans cette URL, ils échouent en CI.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Version figée : une nouvelle version du service se teste et s'adopte par une PR, pas en silence.
      # Lue par les tests des règles de synchro et par docker compose (pnpm e2e:synchro).
      POWERSYNC_IMAGE: journeyapps/powersync-service:1.26.1
      # Même image officielle que Docker Hub, par le miroir public d'AWS (pas de limite anonyme) ;
      # lue par docker-compose.yml pour pnpm e2e:synchro.
      POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:17
    steps:
      - name: Postgres 17 en wal_level=logical
        # Image officielle servie par le miroir public d'AWS : pas de limite de téléchargement anonyme
        # comme sur Docker Hub (CI rouge le 9 octobre 2026 : « toomanyrequests »).
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres \
            --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30 \
            "$POSTGRES_IMAGE" -c wal_level=logical
          timeout 90 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" postgres)" = healthy ]; do sleep 1; done'
      - name: Image du service PowerSync
        # Tirée d'avance : les tests des règles de synchro (T10) démarrent le service eux-mêmes.
        # Docker Hub d'abord ; s'il refuse (limite anonyme), le miroir de Google, retiqueté sous le même nom.
        run: |
          for essai in 1 2 3; do
            docker pull "$POWERSYNC_IMAGE" && exit 0
            docker pull "mirror.gcr.io/$POWERSYNC_IMAGE" && docker tag "mirror.gcr.io/$POWERSYNC_IMAGE" "$POWERSYNC_IMAGE" && exit 0
            sleep $((essai * 20))
          done
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typage strict
        run: pnpm typecheck
      - name: Lint (aucun any)
        run: pnpm lint
      - name: Schéma et migrations synchronisés
        run: |
          # </dev/null : une question interactive (renommage de colonne ?) échoue au lieu d'attendre.
          sortie="$(pnpm --filter @planif/db exec drizzle-kit generate </dev/null 2>&1)" || true
          echo "$sortie"
          if ! grep -q "No schema changes" <<<"$sortie"; then
            echo "::error::drizzle-kit generate n'a pas conclu « No schema changes » : schéma et migrations désynchronisés, ou question interactive (renommage)."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- packages/db/migrations)" ]; then
            echo "::error::Le schéma Drizzle a changé sans migration : lancer pnpm --filter @planif/db generer et versionner le résultat."
            git status --porcelain -- packages/db/migrations
            exit 1
          fi
      - name: Tests unitaires et d'intégration
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build des essais (appli de production et pages de test, servi par pnpm e2e)
        run: pnpm build:essais
      - name: Budget de poids JavaScript
        run: pnpm budget
      - name: Installation de Chromium
        run: pnpm --filter @planif/web exec playwright install --with-deps chromium
      - name: Budgets de temps d'affichage et hors-ligne
        run: pnpm e2e
      - name: Build de la démo en ligne (Vercel)
        run: pnpm build:demo
      - name: Démo en ligne de bout en bout (sans serveur, hors ligne)
        run: pnpm e2e:demo
      - name: Synchro de bout en bout (Postgres, PowerSync, API, deux navigateurs)
        run: pnpm e2e:synchro

<title>Suivi Planifications</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Une colonne : avancement, attente, visuels, tickets, décisions, journal. */
:root {
  --bg: #f5f7f3; --surface: #ffffff; --fg: #1d2620; --muted: #5d6b61; --line: #d9e0d8;
  --accent: #2f7a4b; --accent-soft: #e2efe5;
  --wait: #9a6a00; --wait-soft: #fbf1d8; --cours: #1f5fa8; --cours-soft: #e1ecf8; --idle: #6f7a72; --idle-soft: #eceff0;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121814; --surface: #1a221d; --fg: #e4ebe5; --muted: #9aa89e; --line: #2c3830;
  --accent: #6cc38b; --accent-soft: #1f3526;
  --wait: #e3b64f; --wait-soft: #352c14; --cours: #7fb2ef; --cours-soft: #1b2b3f; --idle: #93a097; --idle-soft: #242c27; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1a221d; --fg: #e4ebe5; --muted: #9aa89e; --line: #2c3830;
  --accent: #6cc38b; --accent-soft: #1f3526;
  --wait: #e3b64f; --wait-soft: #352c14; --cours: #7fb2ef; --cours-soft: #1b2b3f; --idle: #93a097; --idle-soft: #242c27; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--f-body); }
.page { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 48px; display: grid; gap: 34px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.1; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; max-width: 68ch; }
.lead { font-size: 1.08rem; }
.muted { color: var(--muted); }
code, .code { font-family: var(--f-mono); font-size: .82em; }
.eyebrow { font: 600 .75rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
header, section { display: grid; gap: 12px; }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.phase { display: grid; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.phase.active { border-color: var(--accent); }
.ph-tete { display: grid; gap: 2px; }
.ph-num { font: 600 .72rem/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.barre { height: 8px; background: var(--idle-soft); border-radius: 99px; overflow: hidden; }
.barre i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.ph-det { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.vide { padding: 14px 16px; }
.liste { list-style: none; margin: 0; padding: 0; }
.liste li { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.liste li:last-child { border-bottom: 0; }
.decisions li div { display: grid; gap: 2px; }
.q { background: var(--accent-soft); color: var(--accent); padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
.pastille { display: inline-block; font: 600 .75rem/1 var(--f-body); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.p-fait { background: var(--accent-soft); color: var(--accent); }
.p-cours { background: var(--cours-soft); color: var(--cours); }
.p-attente { background: var(--wait-soft); color: var(--wait); }
.p-afaire { background: var(--idle-soft); color: var(--idle); }
.visuels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.visuel { margin: 0; overflow: hidden; display: grid; }
.imgs { display: flex; gap: 8px; padding: 12px; background: var(--idle-soft); overflow-x: auto; }
.imgs img { height: 260px; width: auto; max-width: none; border-radius: 8px; border: 1px solid var(--line); }
figcaption { padding: 12px 14px; display: grid; gap: 6px; justify-items: start; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 .75rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.journal { display: grid; gap: 10px; }
.entree { padding: 14px 16px; display: grid; gap: 6px; }
dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
dt { font-weight: 600; font-size: .85rem; color: var(--muted); }
dd { margin: 0; font-size: .95rem; }
footer { font-size: .85rem; }
@media (max-width: 720px) { .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 1.7rem; } }
</style>
<div class="page">
